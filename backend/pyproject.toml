[project]
name = "auto-jobtracker-backend"
version = "0.1.0"
description = "Auto job tracker backend: scrapers, scheduler, alerts, FastAPI"
requires-python = ">=3.10"
dependencies = [
    "selenium>=4.20",
    "feedparser>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "requests>=2.31",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.uv]
package = false
